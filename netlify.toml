# WordPress leftovers: 410 Gone, served with the 404 page as body

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 410
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
