[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Language redirect on the root. force is needed because dist/index.html exists.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  force = true

# Old WordPress URLs (see docs/rebuild-spec.md)

[[redirects]]
  from = "/de/home-de/"
  to = "/de/"
  status = 301
  force = true

